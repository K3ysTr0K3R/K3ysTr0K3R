name: Update Language Stats

on:
  schedule:
    # Run every day at 03:00 UTC
    - cron: "0 3 * * *"

  # Allow manual runs from the GitHub Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Required so the workflow can update profile/top-langs.svg
    permissions:
      contents: write

    steps:
      # Checkout your profile repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # Generate the language statistics SVG
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=K3ysTr0K3R&layout=compact&langs_count=8&theme=dark&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

          # Fail the workflow if generation fails.
          # This prevents a broken/empty SVG from being committed.
          fail_on_error: true

      # Commit the generated SVG back to the repository
      - name: Commit language statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/top-langs.svg

          # Don't fail if there are no changes
          git commit -m "Update language statistics" || exit 0

          git push
